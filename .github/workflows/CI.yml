name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          # Project.toml declares julia = "1.12", so the current LTS (1.10)
          # cannot resolve. Pin the declared minimum instead of 'lts'.
          - '1.12'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
        exclude:
          # macOS-latest runners are Apple Silicon (arm64); x64 is not available
          - os: macOS-latest
            arch: x64
        include:
          - os: macOS-latest
            arch: aarch64
            version: '1.12'
          - os: macOS-latest
            arch: aarch64
            version: '1'
          - os: macOS-latest
            arch: aarch64
            version: 'nightly'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Authenticate to private repositories
        env:
          MANYUI_READ_TOKEN: ${{ secrets.MANYUI_READ_TOKEN }}
        shell: bash
        run: |
          if [ -z "$MANYUI_READ_TOKEN" ]; then
            echo "::error::Secret MANYUI_READ_TOKEN is not set. Repositories are private and cannot be cloned without it."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${MANYUI_READ_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Check out demo fixtures
        shell: bash
        run: git clone --depth 1 https://github.com/s-celles/ManyUIDemos.jl ../ManyUIDemos
      - name: Dev unregistered dependencies
        env:
          JULIA_PKG_USE_CLI_GIT: "true"
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          deps = PackageSpec[]
          push!(deps, PackageSpec(url="https://github.com/s-celles/ManyUI.jl"))
          push!(deps, PackageSpec(url="https://github.com/s-celles/ManyUITUI.jl"))
          Pkg.develop(deps)
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
